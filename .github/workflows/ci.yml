name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Nonfunctional build-only fixtures: no live database or secrets in PR CI.
      DATABASE_URL: postgresql://build:build@database.invalid/atlas?sslmode=require
      BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_PASSWORD: ci-demo-only-password
      NEXT_PUBLIC_DEMO_PASSWORD: ci-demo-only-password
      DEMO_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
